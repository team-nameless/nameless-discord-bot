[project]
name = "nameless"
version = "1.0.0"
description = "A Discord BOT, written with batteries in mind."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cachetools>=5.4.0",
    "discord-py>=2.6.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "sqlmodel>=0.0.31",
]

[dependency-groups]
dev = [
    "uv>=0.9.18",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.3",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
music = [
    "pomice>=2.10.0",
]
radio = [
    "discord-ext-voice-recv>=0.5.2a179",
]
maimai = [
    "beautifulsoup4>=4.14.3",
]
test = [
    "jishaku>=2.6.3",
]
download = [
    "pyrofork>=2.3.69",
    "tgcrypto-pyrofork>=1.2.8",
    "quickjs-ng",
    "mutagen",
    "requests",
    "cryptography>=48.0.1",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["nameless"]
exclude = ["**/__pycache__", ".venv", "**/.*", "venv", "**/node_modules"]

reportUnusedImport = false
reportUnusedVariable = false
reportUnusedFunction = false

reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment  = "error"
reportPrivateImportUsage            = "error"
reportMissingParameterType = "information"
reportUnknownParameterType = "information"
reportUnknownVariableType  = "information"
reportUnknownArgumentType  = "information"
reportUnusedCallResult  = false
reportUnknownMemberType = false
reportMissingTypeStubs  = false
reportPrivateUsage      = false
reportCallIssue         = false

[tool.ruff]
line-length = 120
indent-width = 4
fix = true
src = ["nameless"]
target-version = "py312"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint.pylint]
max-returns = 10
max-statements = 25

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = [
    # core
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort

    # strictness
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python)
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie (misc lints)
    "RUF",    # ruff-specific rules

    # async
    "ASYNC",  # async/await issues

    # security
    "S",      # flake8-bandit (security)

    # code quality
    "N",      # pep8-naming
    "ANN",    # flake8-annotations (type hints)
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint rules
    "PERF",   # perflint (performance)
    "FURB",   # refurb (modern Python)

    # type checking
    "TCH",    # flake8-type-checking (TYPE_CHECKING blocks)
    "FA",     # flake8-future-annotations

    # todo, fixme, etc.
    "FIX",
]

ignore = [
    "ANN002",   # missing type annotation for *args
    "ANN003",   # missing type annotation for **kwargs
    "ANN401",   # dynamically typed expressions (Any)
    "ANN201",   # missing return type for public function
    "ANN202",   # missing return type for private function
    "ANN204",   # missing return type for __init__
    "S101",     # use of assert
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLW0603",  # global statement
    "ASYNC109", # Async function definition with a `timeout` parameter
    "RUF001",   # String contains ambiguous
    "F403",     # import "*" used; unable to detect undefined names
]
